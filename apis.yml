aid: carpenter-technology
name: Carpenter Technology
description: >-
  Carpenter Technology Corporation is a U.S.-based producer and distributor
  of premium specialty alloys — including titanium alloys, powder metals,
  high-temperature stainless steels, tool steels, and soft magnetic alloys —
  serving the aerospace, defense, medical, transportation, energy, and
  industrial end markets. The company supports customers through technical
  product resources such as its Alloy Finder, alloy technical data sheets,
  conversion tables, and a member-only Customer Portal for order and account
  self-service, but does not currently publish a public developer API.
